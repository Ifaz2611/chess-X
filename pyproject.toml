[project]
name = "chess-x"
version = "2.1.0"
description = "Stockfish-powered bot for chess.com and lichess.org"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.15",
    "webdriver-manager>=4.0",
    "PyAutoGUI>=0.9.54",
    "chess>=1.10",
    "stockfish>=3.28",
    "multiprocess>=0.70",
    "keyboard>=0.13.5",
    "PyQt6>=6.7",
    "pynput>=1.8",
    "packaging>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "black>=24",
    "mypy>=1.10",
    "pre-commit>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "__pycache__", ".git", "logs"]

[tool.ruff.lint]
select = ["E","F","I","UP","B","C4","SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["\\.venv"]

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*", "*/tests/*"]
