<!doctype html>
<html>
<body>
  <wc-chess-board id="board-single" class="board">
    <svg class="coordinates"><text x="10" y="90">1</text></svg>
  </wc-chess-board>
  <div class="player-top">
    <span class="clock-component clock-time-monospace">04:45</span>
  </div>
  <div class="player-bottom">
    <span class="clock-component clock-time-monospace">05:00</span>
  </div>
  <div class="play-controller-scrollable">
    <div class="node white-move" data-node="1">e4</div>
    <div class="node black-move" data-node="2">e5</div>
    <div class="node white-move" data-node="3">Nf3</div>
  </div>
  <div class="board-modal-container" style="display:none"></div>
</body>
</html>
