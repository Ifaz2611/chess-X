<!doctype html>
<html>
<body>
  <wc-chess-board id="board-single" class="board">
    <svg class="coordinates"><text x="10" y="90">1</text></svg>
  </wc-chess-board>
  <div class="player-top">
    <span class="clock-component clock-time-monospace">03:12</span>
  </div>
  <div class="player-bottom">
    <span class="clock-component clock-time-monospace">04:20</span>
  </div>
  <div class="play-controller-scrollable">
    <div class="node white-move" data-node="1">e4</div>
    <div class="node black-move" data-node="2">e5</div>
    <div class="node white-move" data-node="3">Qh5</div>
    <div class="node black-move" data-node="4">Nc6</div>
    <div class="node white-move" data-node="5">Bc4</div>
    <div class="node black-move" data-node="6">Nf6</div>
    <div class="node white-move" data-node="7">Qxf7#</div>
  </div>
  <div class="board-modal-container" style="display:block">
    <div class="game-over-modal">
      <div class="game-over-header">White won by checkmate</div>
      <button class="ui_v5-button-component">New 10 min</button>
    </div>
  </div>
</body>
</html>
