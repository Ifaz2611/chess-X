name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy
      - name: Lint (ruff)
        run: ruff check src tests || true
      - name: Type check (mypy – non-GUI modules)
        run: mypy src/config_store.py src/protocol.py src/board_sync.py src/engine_service.py src/move_executor.py src/utilities.py --ignore-missing-imports || true
      - name: Tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml -q
      - name: Compile check
        run: python -m compileall src
      - name: Cache webdriver
        uses: actions/cache@v4
        with:
          path: ~/.wdm
          key: wdm-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
